name: Issue 25194 A/B Validation

# Proves the fix for vectordotdev/vector#25194 (windows_event_log lost-wakeup race)
# by running the deterministic regression test
# `test_pull_events_preserves_setevent_during_drain` on two cells:
#
#   - fixed: the PR branch as-is                          → test must PASS
#   - buggy: the PR branch with the fix surgically reverted → test must FAIL
#
# The embedded base64 patch (REVERT_PATCH_B64) undoes only the three production
# hunks in `pull_events` (pre-drain ResetEvent, error-path SetEvent re-arm,
# post-drain ResetEvent → else-branch SetEvent) plus the corresponding
# SetEvent import change. It keeps the DRAIN_STEP_HOOK static, the test-hook
# call inside the drain loop, the `first_channel_signal_raw` accessor, and
# the regression test itself — so the same test runs on both cells and the
# only variable is the production drain-loop code.

on:
  workflow_dispatch:
  push:
    branches:
      - tot19/issue-25194-ab-validate

permissions:
  contents: read

jobs:
  ab-test:
    name: ${{ matrix.variant }} (expect ${{ matrix.expect }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: fixed
            expect: pass
          - variant: buggy
            expect: fail
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: tot19/windows-event-log-ci-test
          fetch-depth: 1

