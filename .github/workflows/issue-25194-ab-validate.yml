name: Issue 25194 A/B Validation

# Proves the fix for vectordotdev/vector#25194 (windows_event_log lost-wakeup race)
# by running the deterministic regression tests across three Windows Server
# versions against two cells:
#
#   - fixed: current PR head (tot19/fix-windows-event-log-lost-wakeup-25194) → tests must PASS
#   - buggy: same PR head with the three production fix hunks surgically reverted
#            (matches the pre-fix upstream code that will ship as v0.55)       → tests must FAIL
#
# The embedded base64 patch (APPLY_PATCH_B64) is a forward "fixed → buggy" diff
# that undoes only the three production hunks in `pull_events` (pre-drain
# ResetEvent, error-path SetEvent re-arm, post-drain ResetEvent → else-branch
# SetEvent) plus the corresponding SetEvent import change. It keeps the
# DRAIN_STEP_HOOK static, the test-hook call inside the drain loop, the
# `first_channel_signal_raw` accessor, and the regression tests themselves —
# so the same tests run on both cells and the only variable is the production
# drain-loop code.
#
# Each (os × variant) cell runs unit-only. The end-to-end cells were removed
# because the PR's speculative timeout pull (commit 873d0c8f7f) self-heals
# the race at the mod.rs layer regardless of the subscription.rs bug, making
# e2e inactivity tests unable to discriminate the two cells. The deterministic
# unit tests pin the exact invariants under test.

on:
  workflow_dispatch:
  push:
    branches:
      - tot19/issue-25194-ab-validate

permissions:
  contents: read

jobs:
  ab-test:
    name: ${{ matrix.os }}/${{ matrix.variant }} (expect ${{ matrix.expect }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022, windows-2019]
        include:
          - variant: fixed
            expect: pass
          - variant: buggy
            expect: fail
    steps:
      - name: Checkout PR branch (fixed baseline)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: tot19/fix-windows-event-log-lost-wakeup-25194
          fetch-depth: 1

