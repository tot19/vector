      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Bootstrap Windows environment
        shell: pwsh
        run: .\scripts\environment\bootstrap-windows-2025.ps1

      - name: Run lost-wakeup regression tests (unit)
        id: run-unit-tests
        shell: bash
        continue-on-error: true
        run: |
          cargo test -p vector --no-default-features \
            --features sources-windows_event_log \
            --lib \
            test_pull_events_preserves_setevent_during_drain \
            test_speculative_pull_recovers_without_signal \
            -- --nocapture

      - name: Check fixed-cell expectation
        if: matrix.variant == 'fixed'
        shell: bash
        env:
          OUTCOME: ${{ steps.run-unit-tests.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "::error::Fixed cell on ${{ matrix.os }} FAILED — the fix does not resolve the race, or the test itself is broken"
            exit 1
          fi
          echo "Fixed cell on ${{ matrix.os }}: regression tests PASSED as expected — fix resolves #25194"

      - name: Check buggy-cell expectation
        if: matrix.variant == 'buggy'
        shell: bash
        env:
          OUTCOME: ${{ steps.run-unit-tests.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "::error::Buggy cell on ${{ matrix.os }} PASSED — the regression tests are not actually catching the bug (false-pass)"
            exit 1
          fi
          echo "Buggy cell on ${{ matrix.os }}: regression tests FAILED as expected — proves the tests catch #25194 and the fix is load-bearing"

  summary:
    needs: ab-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo "## Issue #25194 A/B Validation"
            echo ""
            if [ "${{ needs.ab-test.result }}" = "success" ]; then
              echo "Result: **PASS**"
              echo ""
              echo "Ran deterministic regression tests on three Windows Server versions × two cells:"
              echo ""
              echo "- **windows-2025 / fixed**: tests PASSED → fix resolves the lost-wakeup race on Windows Server 2025."
              echo "- **windows-2025 / buggy**: tests FAILED on reverted code → tests discriminate; fix is load-bearing on 2025."
              echo "- **windows-2022 / fixed**: tests PASSED → fix holds on Windows Server 2022."
              echo "- **windows-2022 / buggy**: tests FAILED on reverted code → tests discriminate on 2022."
              echo "- **windows-2019 / fixed**: tests PASSED → fix holds on Windows Server 2019."
              echo "- **windows-2019 / buggy**: tests FAILED on reverted code → tests discriminate on 2019."
              echo ""
              echo "Baseline for \"buggy\" cells matches upstream pre-fix code that will ship as v0.55."
            else
              echo "Result: **FAIL** — see individual cell logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.ab-test.result }}" = "success" ]
