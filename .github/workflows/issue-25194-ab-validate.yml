name: Issue 25194 A/B Validation

# Proves the fix for vectordotdev/vector#25194 (windows_event_log lost-wakeup race)
# by running both the deterministic unit regression tests and a 3.5-minute
# real-service end-to-end inactivity test on Windows Server 2019, 2022, and 2025,
# each against two cells:
#
#   - fixed: current PR head (tot19/fix-windows-event-log-lost-wakeup-25194) → expect PASS
#   - buggy: same PR head with the three production fix hunks surgically reverted
#            (matches the upstream pre-fix code scheduled for v0.55)         → expect FAIL
#
# The embedded base64 patch is a forward "fixed -> buggy" diff that undoes only the
# three production hunks in `pull_events` (pre-drain ResetEvent, error-path SetEvent
# re-arm, post-drain ResetEvent -> else-branch SetEvent) plus the corresponding
# SetEvent import change. It keeps the DRAIN_STEP_HOOK static, the test-hook call
# inside the drain loop, the `first_channel_signal_raw` accessor, and the regression
# tests themselves -- so the same tests run on both cells and the only variable is
# the production drain-loop code.

on:
  workflow_dispatch:
  push:
    branches:
      - tot19/issue-25194-ab-validate

permissions:
  contents: read

jobs:
  ab-test:
    name: ${{ matrix.os }}/${{ matrix.variant }}/${{ matrix.test_kind }} (expect ${{ matrix.expect }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            variant: fixed
            expect: pass
            test_kind: unit
          - os: windows-2025
            variant: fixed
            expect: pass
            test_kind: e2e
          - os: windows-2025
            variant: buggy
            expect: fail
            test_kind: unit
          - os: windows-2025
            variant: buggy
            expect: fail
            test_kind: e2e
          - os: windows-2022
            variant: fixed
            expect: pass
            test_kind: unit
          - os: windows-2022
            variant: fixed
            expect: pass
            test_kind: e2e
          - os: windows-2022
            variant: buggy
            expect: fail
            test_kind: unit
          - os: windows-2022
            variant: buggy
            expect: fail
            test_kind: e2e
          - os: windows-2019
            variant: fixed
            expect: pass
            test_kind: unit
          - os: windows-2019
            variant: fixed
            expect: pass
            test_kind: e2e
          - os: windows-2019
            variant: buggy
            expect: fail
            test_kind: unit
          - os: windows-2019
            variant: buggy
            expect: fail
            test_kind: e2e
    steps:
      - name: Checkout PR branch (fixed baseline)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: tot19/fix-windows-event-log-lost-wakeup-25194
          fetch-depth: 1

