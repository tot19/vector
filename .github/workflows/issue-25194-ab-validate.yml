      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Bootstrap Windows environment
        shell: pwsh
        run: .\scripts\environment\bootstrap-windows-2025.ps1

      - name: Run lost-wakeup regression test
        id: run-test
        shell: bash
        continue-on-error: true
        run: |
          cargo test -p vector --no-default-features \
            --features sources-windows_event_log \
            --lib test_pull_events_preserves_setevent_during_drain \
            -- --nocapture

      - name: Check fixed-cell expectation
        if: matrix.variant == 'fixed'
        shell: bash
        run: |
          if [ "${{ steps.run-test.outcome }}" != "success" ]; then
            echo "::error::Fixed cell FAILED — the fix does not resolve the race, or the test itself is broken"
            exit 1
          fi
          echo "Fixed cell: regression test PASSED as expected — fix resolves #25194"

      - name: Check buggy-cell expectation
        if: matrix.variant == 'buggy'
        shell: bash
        run: |
          if [ "${{ steps.run-test.outcome }}" = "success" ]; then
            echo "::error::Buggy cell PASSED — the regression test is not actually catching the bug (false-pass)"
            exit 1
          fi
          echo "Buggy cell: regression test FAILED as expected — proves the test catches #25194 and the fix is load-bearing"

  summary:
    needs: ab-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo "## Issue #25194 A/B Validation"
            echo ""
            if [ "${{ needs.ab-test.result }}" = "success" ]; then
              echo "Result: **PASS**"
              echo ""
              echo "- Fixed cell: \`test_pull_events_preserves_setevent_during_drain\` PASSED → the fix resolves the lost-wakeup race."
              echo "- Buggy cell: same test FAILED on surgically reverted production code → the regression test genuinely catches #25194 and the fix is load-bearing."
            else
              echo "Result: **FAIL** — see individual cell logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.ab-test.result }}" = "success" ]
